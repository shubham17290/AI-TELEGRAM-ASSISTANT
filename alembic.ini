# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = src/database/migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to src/database/migrations/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# The path separator used here should be the separator specified by "version_path_separator" below.
# version_locations = %(here)s/bar %(here)s/bat src/database/migrations/versions

# version path separator; As mentioned above, this is the character used to split
# the version_locations string into separate paths. The default separator is a space.
# version_path_separator = <space>  # Use a space separator for compatibility with version_locations

# version path separator; As mentioned above, this is the character used to split
# the version_locations string into separate paths. The default separator is a space.
# version_path_separator = <space>  # Use a space separator for compatibility with version_locations

# version path separator; As mentioned above, this is the character used to split
# the version_locations string into separate paths. The default separator is a space.
# version_path_separator = <space>  # Use a space separator for compatibility with version_locations

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

# Set to True to enable SQL logging during migrations
# verbose = false


# database connection URL - will be overridden by environment variable
sqlalchemy.url = sqlite+aiosqlite:///telegram_bot.db


[post_write_hooks]
# post_write_hooks are scripts that will run on new revision files
# after generating the revision scripts. These hooks can be used to
# add additional functionality to the revision process, such as
# running tests, linting, or other tasks.
# YOu can have multiple hooks, just add more entries to the list
# hooks = black, isort

# Using hooks:
#   black = %(here)s/.venv/bin/black
#   isort = %(here)s/.venv/bin/isort
#   flake8 = %(here)s/.venv/bin/flake8

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
